# 不含 Secret 值的本機 bootstrap 合約 —— 範本。
#
# 複製為 config/environment.yaml 後填入你自己的值。
# config/environment.yaml 已被 .gitignore 排除。
#
# 刻意維持 bootstrap-pending：在操作員確認實際路徑、GitLab 與 Discord
# 資源之前，environment-validate --require-ready 必須持續失敗。
version: 1
status: bootstrap-pending

implementation:
  repository: /home/nickhuang23/oab-agents-control
  default_branch: main

paths:
  catalog: /home/nickhuang23/oab-agents-control/config/catalog.yaml
  coordination_repository: /home/nickhuang23/oab-agents/coordination
  collection_roots:
    - /home/nickhuang23/repositories
  agent_worktrees_root: /home/nickhuang23/oab-agent-worktrees
  k3s_state: /home/nickhuang23/oab-k3s-state
  backup_target: /home/nickhuang23/oab-agent-backups
  secrets_file: /home/nickhuang23/oab-agents-control/config/secrets.yaml

gitlab:
  # 本機 bootstrap 階段使用本機 bare repo 作為 delivery remote，
  # 對應 config/remotes.json 的 file:// URL。
  host: local-bootstrap.invalid
  default_base_branch: origin/main
  projects:
    - openab-council-relay
  identity_refs:
    - gitlab-bootstrap

discord:
  # ⚠️ 佔位值，需替換為真實 Discord ID
  server_id: "900000000000000000"
  leader_entry_channel_id: "900000000000001001"
  human_user_ids:
    - "900000000000002001"
  bot_identities:
    - leader
    - researcher
    - developer
    - reviewer

profiles:
  leader:
    role: leader
    bot_secret_ref: discord-leader/token
    model: model-leader
    image: ghcr.io/openabdev/openab:0.10.0-beta.3-codex
  researcher:
    role: researcher
    bot_secret_ref: discord-researcher/token
    model: model-researcher
    image: ghcr.io/openabdev/openab:0.10.0-beta.3-copilot
  developer:
    role: developer
    bot_secret_ref: discord-developer/token
    model: model-developer
    image: ghcr.io/openabdev/openab:0.10.0-beta.3-codex
  reviewer:
    role: reviewer
    bot_secret_ref: discord-reviewer/token
    model: model-reviewer
    image: ghcr.io/openabdev/openab:0.10.0-beta.3-copilot

k3s:
  context: default
  deployer_kubeconfig_env: KUBECONFIG
  secret_materializer_kubeconfig_env: OAB_SECRET_MATERIALIZER_KUBECONFIG
  secrets_encryption_enabled: true
  secrets_encryption_recovery_ref: operator://local-k3s-secrets-recovery
  network_policy_controller: kube-router

  # Egress 管控模式：
  #   proxy-only（預設）只放行往 oab-egress proxy —— 但 OpenAB 的 Discord
  #     gateway 直連、不支援 proxy，此模式下 agent 沒有可用的對外路徑。
  #   public-tls 額外放行公網 TCP/443，仍拒絕內網與雲端 metadata 位址。
  # 取捨與收緊條件見 docs/架構說明.md#egress-管控
  egress_mode: proxy-only

# ready 狀態要求此清單為空。逐項確認後才可刪除。
pending_decisions:
  - key: control_host.paths
    owner: operator
    placeholder_policy: 替換為本機實際的 catalog、collection root、worktree 與備份路徑
  - key: gitlab.projects
    owner: operator
    placeholder_policy: 加入精確本機 repository 路徑與 delivery remote
  - key: discord.identities_and_channels
    owner: operator
    placeholder_policy: 僅加入數字 Discord ID；bot ID 可由 token 第一段 base64 解出
  - key: runtime_profiles
    owner: operator
    placeholder_policy: 固定 ACP command、model、OpenAB image 與 working_dir（須符合 image 變體）
  - key: k3s_and_egress
    owner: operator
    placeholder_policy: 確認 kubeconfig 環境變數、Secrets 加密，並決定 egress_mode
