# 不含 Secret 值的本機 bootstrap 合約。
#
# 狀態：ready —— 本機 K3s 已 bootstrap，路徑均已存在，可用於 deploy --yes。
#
# ⚠️  Discord 與 GitLab 區段目前仍是佔位值。它們不影響 deploy 能否執行
#     （驗證器只檢查格式與非敏感性），但在 Discord／GitLab adapter 真的要
#     運作前必須換成真實值。詳見 docs/部署前置資料清單.md。
version: 1
status: ready

implementation:
  repository: /home/nickhuang23/oab-agents-control
  default_branch: main

paths:
  catalog: /home/nickhuang23/oab-agents-control/config/catalog.yaml
  coordination_repository: /home/nickhuang23/oab-agents/coordination
  collection_roots:
    - /home/nickhuang23/repositories
  agent_worktrees_root: /home/nickhuang23/oab-agent-worktrees
  k3s_state: /home/nickhuang23/oab-k3s-state
  backup_target: /home/nickhuang23/oab-agent-backups
  secrets_file: /home/nickhuang23/oab-agents-control/config/secrets.yaml

gitlab:
  # 本機 bootstrap 階段使用本機 bare repo 作為 delivery remote，
  # 對應 config/remotes.json 的 file:// URL。
  host: local-bootstrap.invalid
  default_base_branch: origin/main
  projects:
    - openab-council-relay
  identity_refs:
    - gitlab-bootstrap

discord:
  # ⚠️ 佔位值，需替換為真實 Discord ID
  server_id: "900000000000000000"
  leader_entry_channel_id: "900000000000001001"
  human_user_ids:
    - "900000000000002001"
  bot_identities:
    - leader
    - researcher
    - developer
    - reviewer

profiles:
  leader:
    role: leader
    bot_secret_ref: discord-leader/token
    model: model-leader
    image: ghcr.io/openabdev/openab:0.9.0-beta.9-native
  researcher:
    role: researcher
    bot_secret_ref: discord-researcher/token
    model: model-researcher
    image: ghcr.io/openabdev/openab:0.9.0-beta.9-native
  developer:
    role: developer
    bot_secret_ref: discord-developer/token
    model: model-developer
    image: ghcr.io/openabdev/openab:0.9.0-beta.9-native
  reviewer:
    role: reviewer
    bot_secret_ref: discord-reviewer/token
    model: model-reviewer
    image: ghcr.io/openabdev/openab:0.9.0-beta.9-native

k3s:
  context: default
  deployer_kubeconfig_env: KUBECONFIG
  secret_materializer_kubeconfig_env: OAB_SECRET_MATERIALIZER_KUBECONFIG
  secrets_encryption_enabled: true
  secrets_encryption_recovery_ref: operator://local-k3s-secrets-recovery
  network_policy_controller: kube-router

  # ------------------------------------------------------------------------
  # Egress 管控：暫時放寬為 public-tls
  #
  # 為什麼不是 proxy-only（原設計的目標狀態）：
  #   proxy-only 只放行往 oab-egress namespace 的 proxy，但 OpenAB 的 Discord
  #   gateway 走 tokio_tungstenite::connect_async() 直連，二進位檔中沒有任何
  #   HTTPS_PROXY 支援。也就是說即使把 proxy 建起來，agent 也不會使用它，
  #   結果是 agent 完全沒有對外路徑、bot 無法連線。
  #   （原設計的缺陷分析見 docs/架構說明.md#egress-管控）
  #
  # public-tls 實際給了什麼：
  #   ✅ 允許公網 TCP/443
  #   ✅ 仍然拒絕 RFC1918 內網（阻止叢集內橫向移動）
  #   ✅ 仍然拒絕 169.254.0.0/16（阻止竊取雲端 metadata 憑證）
  #   ❌ 沒有逐網域管控 —— agent 可連任何公開 HTTPS 主機
  #
  # 何時必須收緊回去：
  #   1. agent 拿到真實 LLM 憑證（能自主行動）之前
  #   2. workspace 掛載了不希望外流的內容之前
  #   3. 這套東西要跑在共用或正式主機上之前
  #
  # 收緊的正解不是 proxy，是 Cilium 的 toFQDNs（eBPF 攔截 DNS，不需要
  # client 支援 proxy，因此 WebSocket 也管得到）。
  egress_mode: public-tls

# 已全部解決；ready 狀態要求此清單為空。
pending_decisions: []
